name: GHActions

# This workflow is triggered on pushes, pull-requeust, and releases
# ghactions* branch names will trigger this to support development testing

on:
  push:
    branches:
      - main
      - 'CICE*'
      - 'ghactions*'
  pull_request:
  release:
    types:
      - created

# Establish a secure, read-only baseline for the repository token
permissions:
  contents: read

defaults:
  run:
    shell: /bin/csh -e {0}

jobs:
  build:
    name: "CICETesting"
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }} 
    strategy:
      fail-fast: false   # <-- Keeps other matrix jobs running if one fails
      matrix:
        os: [macos-latest, ubuntu-latest, macos-15]
#        os: [macos-latest]
#        os: [macos-15]
#        os: [ubuntu-latest]
        include: 
          - os: macos-latest
            envdef: macos
            testid: M00
            testsuites: "travis_suite"
            experimental: true
          - os: macos-15
            envdef: macos
            testid: M15
            testsuites: "travis_suite"
            experimental: false
          - os: ubuntu-latest
            envdef: linux
            testid: L00
            testsuites: "travis_suite"
            experimental: false
    steps:
      - name: install linux tcsh
        shell: /bin/bash {0}
        if: contains( matrix.envdef, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y tcsh
      - name: system info
        shell: /bin/bash {0}
        run: |
          type wget
          type curl
          type csh
          echo "readlink \$(which csh): $(python -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' $(which csh))"
          echo "csh --version: $(csh --version)"
          echo "uname -a: $(uname -a)"
          echo "sw_vers: $(sw_vers)"
          echo "HOME: $HOME"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "OS: ${{ matrix.os }}"
          echo "TESTID: ${{ matrix.testid }}"
          echo "ENVDEF: ${{ matrix.envdef }}"
      - name: clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
      - name: create directories
        shell: /bin/bash {0}
        run: |
          ln -s "${GITHUB_WORKSPACE}/../CICE" "${HOME}/cice"
          mkdir -p ${HOME}/cice-dirs/runs ${HOME}/cice-dirs/baseline ${HOME}/cice-dirs/input
#          ls -al ${HOME}/
#          ls -al ${GITHUB_WORKSPACE}/
      - name: check for tabs
        shell: /bin/csh -e {0}
        run: |
          cd $HOME/cice/cicecore
          set cnt = 0
          set ffiles = `find -P . -iname "*.f*"`
          set cfiles = `find -P . -iname "*.c*"`
          foreach file ($ffiles $cfiles)
            set fcnt = `sed -n '/\t/p' $file | wc -l`
            @ cnt = $cnt + $fcnt
            if ($fcnt > 0) then
               echo "TAB found: $fcnt $file"
            endif
          end
          exit $cnt
      - name: setup conda env
        id: micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: configuration/scripts/machines/environment.yml
          cache-environment: true
          cache-environment-key: env-${{ runner.os }}-${{ hashFiles('configuration/scripts/machines/environment.yml') }}
          init-shell: none
      - name: activate conda env
        shell: /bin/bash {0}
        run: |
          echo "CONDA_PREFIX=${{ steps.micromamba.outputs.environment-path }}" >> $GITHUB_ENV
          echo "${{ steps.micromamba.outputs.environment-path }}/bin" >> $GITHUB_PATH
      - name: check conda env
        shell: /bin/bash {0}
        run: |
          which clang
          clang --version
          which gcc
          gcc --version
          which gfortran
          gfortran --version
          which mpicc
          mpicc --version
          which mpifort
          mpifort --version
          which make
          make --version
      - name: check setup case
        shell: /bin/csh -e {0}
        run: |
          cd $HOME/cice
          ./cice.setup -m conda -e ${{ matrix.envdef }} -c case0${{ matrix.testid }} --pes 1x1 -s diag1
      - name: check setup test
        shell: /bin/csh -e {0}
        run: |
          cd $HOME/cice
          ./cice.setup -m conda -e ${{ matrix.envdef }} --test smoke --testid c0${{ matrix.testid }}
      - name: run hello world unit test
        shell: /bin/csh -e {0}
        run: |
          cd $HOME/cice
          ./cice.setup -m conda -e ${{ matrix.envdef }} --test unittest --pes 2x1 -s helloworld --testid hw01
          cd *helloworld*hw01
          ./cice.build
          ./cice.run
      - name: check cice compile
        shell: /bin/csh -e {0}
        run: |
          cd $HOME/cice
          ./cice.setup -m conda -e ${{ matrix.envdef }} -c case1${{ matrix.testid }} --pes 2x2 -s diag1
          cd case1${{ matrix.testid }}
          ./cice.build
      - name: download input data
        shell: /bin/csh -e {0}
        run: |
          cd $HOME/cice-dirs/input
          wget --progress=dot:giga https://zenodo.org/record/3728358/files/CICE_data_gx3_grid_ic-20200320.tar.gz
          set shaval = "bd46ec49580ab11b8d4b05e381f180f5d25c04c137430e0f69bfdd48a2d02485"
          set shacmp = `sha256sum CICE_data_gx3_grid_ic-20200320.tar.gz | cut -f 1 -d " "`
          if ( "${shaval}" != "${shacmp}" ) then
            echo "Download sha256sum error"
            exit 1
          endif
          tar xvfz CICE_data_gx3_grid_ic-20200320.tar.gz
          wget --progress=dot:giga https://zenodo.org/records/10419929/files/CICE_data_gx3_forcing_JRA55_200501_20231220.tar.gz
          set shaval = "9b6c3781b46017de6f4762a1ec5283ac47393de17f8bb9488738e470ac3263a8"
          set shacmp = `sha256sum CICE_data_gx3_forcing_JRA55_200501_20231220.tar.gz | cut -f 1 -d " "`
          if ( "${shaval}" != "${shacmp}" ) then
            echo "Download sha256sum error"
            exit 1
          endif
          tar xvfz CICE_data_gx3_forcing_JRA55_200501_20231220.tar.gz
          pwd
          cd CICE_data/forcing/gx3/JRA55/8XDAILY
          ln -s JRA55_gx3_03hr_forcing_200501.nc JRA55_gx3_03hr_forcing_2005.nc
          cd $HOME/cice-dirs/input
          ls -alR
#      - name: run case
#        shell: /bin/csh -e {0}
#        run: |
#          cd $HOME/cice
#          cd case1
#          ./cice.run
      - name: run suite
        shell: /bin/csh -e {0}
        run: |
          cd $HOME/cice
          ./cice.setup -m conda -e ${{ matrix.envdef }} --suite ${{ matrix.testsuites }} --testid ${{ matrix.testid }}
      - name: write output
        shell: /bin/csh -e {0}
        run: |
          cd $HOME/cice
          ./.github/workflows/write_logfiles.csh
          cd testsuite.${{ matrix.testid }}
          ./results.csh
      - name: successful run
        if: ${{ success() }}
        run: |
          echo "${{ job.name }} PASSED"
      - name: trap failure
        if: ${{ failure() }}
        run: |
          echo "${{ job.name }} FAILED"
          exit 99
