name: Issue/PR Label and PR Reviewer Slash Commands

# This workflow is triggered by comments on PRs and Issues. It supports
# setting labels by the /label and /unlabel string in comment text boxes.
# It also supports setting reviewers with the /review and /unreview comments.
# It supports both forward and backslash, single or double quotes, and ignores 
# cases and spaces. So
#
#    /label "Priority : high"
#    \label 'priority:HIGH'
#    \label priority:high
#
# should all turn on the "Priority: High" label. /unlabel works the same
# but removes the label on the issue or PR. It parses the comment and updates labels in the 
# order they occur in the comment. It adds a thumbs up or thumbs down to the comment 
# depending on the outcome of the labeling script.
#
# Reviewers use the same parsing, but in addition, can be set with an @ or not.
#
#    /review abcd
#    /review @abcd
#
# each add reviewer abcd.

on:
  issue_comment:
    types: [created, edited]

jobs:
  manage-labels:
    # Run on Issues and Pull Requests, ignore bots and allow collaborators to use this
    if: >-
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Parse and Execute Validated Label and Review Commands
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
        run: |
          python3 - << 'EOF'
          import os, re, subprocess

          comment_body = os.environ["COMMENT_BODY"]
          comment_id = os.environ["COMMENT_ID"]
          issue_number = os.environ["ISSUE_NUMBER"]
          repo = os.environ["REPOSITORY"]
          is_pr = os.environ["IS_PULL_REQUEST"] == "true"

          def run_gh(args):
              res = subprocess.run(["gh"] + args, capture_output=True, text=True)
              return res.returncode == 0, res.stdout.strip(), res.stderr.strip()

          normalize_label = lambda s: re.sub(r"\s+", "", s.lower())

          command_regex = re.compile(
              r"[/\\](label|unlabel|review|unreview)\s+(?:\"([^\"]+)\"|'([^']+)'|([^\s\n]+))",
              re.IGNORECASE
          )

          matches = list(command_regex.finditer(comment_body))
          if not matches:
              raise SystemExit(0)

          has_label_cmds = any(m.group(1).lower() in ("label", "unlabel") for m in matches)
          valid_labels_map = {}

          if has_label_cmds:
              ok, out, err = run_gh(["api", "--paginate", f"repos/{repo}/labels", "--jq", ".[].name"])
              if not ok:
                  print(f"Failed to retrieve repository labels: {err}")
                  raise SystemExit(1)
              valid_labels_map = {normalize_label(lbl): lbl for lbl in out.splitlines()}

          success_count = 0
          error_count = 0

          for match in matches:
              command = match.group(1).lower()
              raw_target = match.group(2) or match.group(3) or match.group(4)
              if not raw_target:
                  continue

              # --- LABEL COMMANDS ---
              if command in ("label", "unlabel"):
                  canonical_label = valid_labels_map.get(normalize_label(raw_target))
                  if not canonical_label:
                      print(f'SKIPPED: Label "{raw_target}" does not exist in repository.')
                      error_count += 1
                      continue

                  if command == "label":
                      ok, _, err = run_gh(["issue", "edit", issue_number, "--repo", repo, "--add-label", canonical_label])
                      if ok:
                          print(f'SUCCESS: Added label "{canonical_label}" to issue/PR #{issue_number}.')
                          success_count += 1
                      else:
                          print(f'FAILED: to add label "{canonical_label}": {err}')
                          error_count += 1
                  elif command == "unlabel":
                      ok, _, err = run_gh(["issue", "edit", issue_number, "--repo", repo, "--remove-label", canonical_label])
                      if ok:
                          print(f'SUCCESS: Removed label "{canonical_label}" from issue/PR #{issue_number}.')
                          success_count += 1
                      else:
                          if "not found" in err.lower() or "404" in err:
                              print(f'OK: Label "{canonical_label}" was already absent.')
                              success_count += 1
                          else:
                              print(f'FAILED: to remove label "{canonical_label}": {err}')
                              error_count += 1

              # --- REVIEWER COMMANDS ---
              elif command in ("review", "unreview"):
                  if not is_pr:
                      print(f'Skipped: Cannot request reviewers on Issues (Command: /{command} {raw_target}).')
                      error_count += 1
                      continue

                  target_user = raw_target.strip()
                  if target_user.startswith("@"):
                      target_user = target_user[1:]

                  if command == "review":
                      ok, _, err = run_gh(["pr", "edit", issue_number, "--repo", repo, "--add-reviewer", target_user])
                      if ok:
                          print(f'SUCCESS: Added reviewer "{target_user}" to PR #{issue_number}.')
                          success_count += 1
                      else:
                          print(f'FAILED: to add reviewer "{target_user}": {err}')
                          error_count += 1
                  elif command == "unreview":
                      ok, _, err = run_gh(["pr", "edit", issue_number, "--repo", repo, "--remove-reviewer", target_user])
                      if ok:
                          print(f'SUCCESS: Removed reviewer "{target_user}" from PR #{issue_number}.')
                          success_count += 1
                      else:
                          print(f'FAILED: to remove reviewer "{target_user}": {err}')
                          error_count += 1

          if success_count > 0 and error_count == 0:
              ok, _, err = run_gh([
                  "api",
                  f"repos/{repo}/issues/comments/{comment_id}/reactions",
                  "-f", "content=+1"
              ])
              if not ok:
                  print(f"FAILED: to add thumbs-up reaction: {err}")

          elif error_count > 0:
              ok, _, err = run_gh([
                  "api",
                  f"repos/{repo}/issues/comments/{comment_id}/reactions",
                  "-f", "content=-1"
              ])
              if not ok:
                  print(f"FAILED: to add thumbs-down reaction: {err}")

          EOF
