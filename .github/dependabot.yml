
version: 2
updates:

  # Set update schedule for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"         # Options: monday, tuesday, wednesday, thursday, friday, saturday, sunday
      time: "03:00"          # The time of day to check for updates (HH:MM)
      timezone: "America/New_York" # Explicitly sets the timezone for the execution time
    open-pull-requests-limit: 3

  # Check Git submodules for updates
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "03:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3

  # Check pyproject.toml inside doc directory
  - package-ecosystem: "pip"
    directory: "/doc"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:00"
      timezone: "America/New_York"
    # silences version updates but forces PRs for security patches
    open-pull-requests-limit: 0
